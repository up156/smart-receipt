databaseChangeLog:
  - changeSet:
      id: 0-create-tables
      author: up156
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: full_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: password, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: is_admin, type: BOOLEAN, constraints: { nullable: false } }

        - createTable:
            tableName: category
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: monthly_limit, type: "NUMERIC(10,2)" }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_category_user, references: users(id) } }

        - createTable:
            tableName: receipt
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: receipt_date, type: DATE, constraints: { nullable: false } }
              - column: { name: total_price, type: "NUMERIC(10,2)", constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_receipt_user, references: users(id) } }

        - createTable:
            tableName: product
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: price, type: "NUMERIC(10,2)", constraints: { nullable: false } }
              - column: { name: receipt_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_product_receipt, references: receipt(id) } }
              - column: { name: category_id, type: BIGINT, constraints: { nullable: true, foreignKeyName: fk_product_category, references: category(id) } }

        - createTable:
            tableName: category_stats
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: year, type: INT, constraints: { nullable: false } }
              - column: { name: month, type: INT, constraints: { nullable: false } }
              - column: { name: month_total, type: "NUMERIC(10,2)" }
              - column: { name: monthly_limit, type: "NUMERIC(10,2)" }
              - column: { name: category_id, type: BIGINT, constraints: { nullable: true, foreignKeyName: fk_stats_category, references: category(id) } }